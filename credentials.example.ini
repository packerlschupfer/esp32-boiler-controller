; Example credentials file - Copy to credentials.ini and fill in your values
; DO NOT COMMIT credentials.ini TO VERSION CONTROL!
; Add credentials.ini to .gitignore

[credentials]
build_flags =
    -DMQTT_USERNAME=\"your_mqtt_username\"
    -DMQTT_PASSWORD=\"your_mqtt_password\"
    -DOTA_PASSWORD=\"your_ota_password\"

; OTA upload auth for the espota envs (platformio.ini: --auth=${credentials.ota_password}),
; must equal OTA_PASSWORD above
ota_password = your_ota_password
