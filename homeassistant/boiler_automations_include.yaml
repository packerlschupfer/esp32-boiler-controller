- id: boiler_refresh_param_groups
  alias: "Boiler: refresh parameter groups"
  description: >-
    Grouped param replies on boiler/params/status/<group> are retained and republished by the
    firmware on every set (library 315a969), but NOT on boot/MQTT connect, so a retained group can
    be pre-reboot stale. Re-request each group (paced, to spare the ESP32 mqtt_high_priority queue)
    on HA start and whenever the boiler comes online. A manual run refreshes too.
  mode: queued
  max: 5
  triggers:
    - trigger: homeassistant
      event: start
      id: all
    - trigger: mqtt
      topic: "boiler/status/online"
      id: all
  conditions:
    - condition: template
      value_template: >-
        {{ trigger is not defined or trigger.platform != 'mqtt'
           or 'true' in trigger.payload or trigger.payload == 'online' }}
  actions:
    - delay: "{{ 15 if trigger is defined and trigger.id is defined and trigger.id == 'all' else 0 }}"
    - repeat:
        for_each: [heating, h, pid, sensor, wheater, w]
        sequence:
          - action: mqtt.publish
            data:
              topic: "boiler/params/get/{{ repeat.item }}"
              payload: ""
          - delay: 1.5

- id: boiler_health_stale
  alias: "Boiler health data stopped"
  description: "Warn when boiler/status/health stops arriving while the boiler is otherwise online (payload near the 256 B firmware limit); clear when it returns"
  trigger:
    - platform: state
      entity_id: binary_sensor.boiler_health_reporting
      to: "unavailable"
      for: "00:10:00"
      id: stale
    - platform: state
      entity_id: binary_sensor.boiler_health_reporting
      to: "on"
      id: back
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: stale
            - condition: template
              value_template: "{{ states('sensor.boiler_output_temp_2') not in ['unavailable', 'unknown'] }}"
          sequence:
            - service: persistent_notification.create
              data:
                notification_id: boiler_health_stale
                title: "Boiler health data stopped"
                message: >-
                  No boiler/status/health message for over 10 minutes, but the boiler is still
                  publishing sensor data. Memory and uptime readings are not current. Likely cause:
                  the health payload grew past the firmware's 256 B MQTT limit.
        - conditions:
            - condition: trigger
              id: back
          sequence:
            - service: persistent_notification.dismiss
              data:
                notification_id: boiler_health_stale
  mode: single
